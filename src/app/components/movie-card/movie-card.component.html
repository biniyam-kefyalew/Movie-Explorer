<div
  class="group relative bg-gray-900/90 rounded-xl overflow-hidden border border-gray-800/80 hover:border-red-600/50 transition-all duration-300 transform hover:-translate-y-1.5 hover:shadow-2xl hover:shadow-red-950/20 cursor-pointer flex flex-col h-full"
  [routerLink]="detailLink"
>
  <!-- Poster Container with 2:3 Aspect Ratio -->
  <div class="relative aspect-[2/3] w-full overflow-hidden bg-gray-950">
    <img
      [src]="posterUrl"
      [alt]="movie.title"
      loading="lazy"
      (error)="onImageError($event)"
      class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105"
    />

    <!-- Gradient overlay on hover -->
    <div class="absolute inset-0 bg-gradient-to-t from-gray-950 via-transparent to-black/30 opacity-60 group-hover:opacity-80 transition-opacity"></div>

    <!-- Free Playable Badge -->
    <div
      *ngIf="movie.freePlayable"
      class="absolute top-2 left-2 bg-emerald-600/90 text-white text-[11px] font-semibold px-2 py-0.5 rounded-full flex items-center gap-1 shadow-md backdrop-blur-sm"
    >
      <span class="w-1.5 h-1.5 rounded-full bg-emerald-200 animate-pulse"></span>
      FREE STREAM
    </div>

    <!-- Rating Badge -->
    <div
      *ngIf="movieRating"
      class="absolute top-2 right-2 bg-black/70 backdrop-blur-md text-amber-400 text-xs font-semibold px-2 py-1 rounded-md flex items-center gap-1 border border-white/10"
    >
      <span>⭐</span>
      <span class="text-white">{{ movieRating }}</span>
    </div>

    <!-- Favorite Toggle Button -->
    <button
      (click)="toggleFavorite($event)"
      [attr.aria-label]="isFavorite ? 'Remove from favorites' : 'Add to favorites'"
      class="absolute bottom-2 right-2 p-2 rounded-full bg-black/60 hover:bg-red-600/80 backdrop-blur-md text-white transition-all transform hover:scale-110 active:scale-95 border border-white/10 focus:outline-none"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="currentColor"
        class="w-4 h-4 transition-colors"
        [ngClass]="{ 'text-red-500 fill-current': isFavorite, 'text-gray-300': !isFavorite }"
      >
        <path
          d="m11.645 20.91-.007-.003-.022-.012a15.247 15.247 0 0 1-.383-.218 25.18 25.18 0 0 1-4.244-3.17C4.688 15.36 2.25 12.174 2.25 8.25 2.25 5.322 4.714 3 7.688 3A5.5 5.5 0 0 1 12 5.052 5.5 5.5 0 0 1 16.313 3c2.973 0 5.437 2.322 5.437 5.25 0 3.925-2.438 7.111-4.739 9.256a25.175 25.175 0 0 1-4.244 3.17 15.247 15.247 0 0 1-.383.219l-.022.012-.007.004-.003.001a.752.752 0 0 1-.704 0l-.003-.001Z"
        />
      </svg>
    </button>
  </div>

  <!-- Card Info -->
  <div class="p-3.5 flex flex-col flex-grow justify-between bg-gradient-to-b from-gray-900 to-gray-950">
    <div>
      <h3
        class="text-sm font-semibold text-gray-100 group-hover:text-red-400 transition-colors line-clamp-1"
        [title]="movie.title"
      >
        {{ movie.title }}
      </h3>
      <div class="flex items-center gap-2 mt-1 text-xs text-gray-400">
        <span *ngIf="movieYear">{{ movieYear }}</span>
        <span *ngIf="movieYear && movie.genres && movie.genres.length > 0">•</span>
        <span *ngIf="movie.genres && movie.genres.length > 0" class="truncate max-w-[120px]">
          {{ movie.genres[0].name }}
        </span>
      </div>
    </div>
  </div>
</div>
