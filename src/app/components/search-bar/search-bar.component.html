<div class="relative w-full max-w-xl">
  <!-- Search Input Container -->
  <div class="relative flex items-center">
    <div class="absolute left-3.5 pointer-events-none text-gray-400">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
      </svg>
    </div>

    <input
      type="text"
      [value]="searchQuery"
      (input)="onInput($event)"
      (keydown.enter)="onSearch()"
      placeholder="Search movies, actors, directors..."
      class="w-full pl-10 pr-16 py-2 md:py-2.5 bg-gray-900/90 text-sm text-gray-100 placeholder-gray-400 rounded-full border border-gray-700/80 focus:border-red-500 focus:ring-2 focus:ring-red-500/20 focus:outline-none transition-all shadow-inner backdrop-blur-md"
    />

    <!-- Action Icons inside input (Loading spinner / Clear button) -->
    <div class="absolute right-3 flex items-center gap-1.5">
      <div *ngIf="isLoading" class="w-4 h-4 border-2 border-red-500 border-t-transparent rounded-full animate-spin"></div>

      <button
        *ngIf="searchQuery && !isLoading"
        (click)="clearSearch()"
        type="button"
        class="text-gray-400 hover:text-white p-1 rounded-full focus:outline-none"
      >
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>

      <button
        (click)="onSearch()"
        type="button"
        class="hidden sm:block text-xs bg-red-600 hover:bg-red-700 text-white font-medium px-2.5 py-1 rounded-full transition-colors ml-1"
      >
        Go
      </button>
    </div>
  </div>

  <!-- Live Dropdown Suggestions -->
  <div
    *ngIf="isDropdownOpen && suggestions.length > 0"
    class="absolute left-0 right-0 top-full mt-2 bg-gray-900/95 backdrop-blur-xl border border-gray-800 rounded-2xl shadow-2xl overflow-hidden z-50 divide-y divide-gray-800/80 animate-in fade-in zoom-in-95 duration-150"
  >
    <div class="p-2">
      <div
        *ngFor="let item of suggestions"
        (click)="selectItem(item)"
        class="flex items-center gap-3 p-2 rounded-xl hover:bg-gray-800/80 transition-colors cursor-pointer group"
      >
        <!-- Poster / Headshot -->
        <div class="w-10 h-14 rounded-lg bg-gray-950 overflow-hidden flex-shrink-0 border border-gray-800">
          <img
            [src]="item.posterUrl || 'assets/image/icon.png'"
            [alt]="item.title"
            class="w-full h-full object-cover group-hover:scale-105 transition-transform"
          />
        </div>

        <!-- Info -->
        <div class="flex-grow min-w-0">
          <div class="flex items-center gap-2">
            <h4 class="text-sm font-semibold text-gray-100 group-hover:text-red-400 transition-colors truncate">
              {{ item.title }}
            </h4>
            <span
              class="text-[10px] font-medium uppercase px-1.5 py-0.5 rounded border"
              [ngClass]="{
                'bg-blue-950 text-blue-300 border-blue-800': item.type === 'movie',
                'bg-purple-950 text-purple-300 border-purple-800': item.type === 'tv',
                'bg-amber-950 text-amber-300 border-amber-800': item.type === 'person'
              }"
            >
              {{ item.type || 'Movie' }}
            </span>
          </div>

          <div class="flex items-center gap-2 text-xs text-gray-400 mt-0.5">
            <span *ngIf="item.year">{{ item.year }}</span>
            <span *ngIf="item.year && item.rating">•</span>
            <span *ngIf="item.rating" class="text-amber-400 font-medium">⭐ {{ item.rating }}</span>
            <span
              *ngIf="item.freePlayable"
              class="text-[10px] bg-emerald-950 text-emerald-300 border border-emerald-800 px-1 rounded ml-1"
            >
              FREE
            </span>
          </div>
        </div>
      </div>
    </div>

    <!-- Dropdown Footer -->
    <div
      (click)="onSearch()"
      class="px-4 py-2.5 bg-gray-950/60 hover:bg-red-950/40 text-xs font-medium text-center text-red-400 hover:text-red-300 cursor-pointer transition-colors flex items-center justify-center gap-1"
    >
      <span>See all results for "{{ searchQuery }}"</span>
      <span>→</span>
    </div>
  </div>
</div>
