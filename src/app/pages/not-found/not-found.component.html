<div class="min-h-[80vh] flex items-center justify-center px-4 py-16 sm:px-6 lg:px-8 relative overflow-hidden bg-gray-950">
  <!-- Cinematic Ambient Background Glow -->
  <div class="absolute inset-0 pointer-events-none overflow-hidden">
    <div class="absolute -top-40 left-1/2 -translate-x-1/2 w-[700px] h-[500px] bg-red-600/10 rounded-full blur-[140px]"></div>
    <div class="absolute bottom-0 right-1/4 w-[400px] h-[300px] bg-blue-600/5 rounded-full blur-[120px]"></div>
  </div>

  <div class="relative z-10 max-w-xl w-full text-center space-y-8">
    <!-- Film Clapboard / Projector Icon -->
    <div class="inline-flex items-center justify-center">
      <div class="relative">
        <span class="text-7xl sm:text-8xl select-none animate-pulse">🎬</span>
        <span class="absolute -top-2 -right-2 text-2xl">⚡</span>
      </div>
    </div>

    <!-- 404 Title -->
    <div class="space-y-3">
      <div class="text-7xl sm:text-9xl font-black tracking-tighter text-transparent bg-clip-text bg-gradient-to-b from-white via-gray-200 to-gray-600 drop-shadow-2xl">
        404
      </div>
      <h1 class="text-2xl sm:text-3xl font-extrabold text-white tracking-tight">
        Scene Missing / Lost Reel
      </h1>
      <p class="text-sm sm:text-base text-gray-400 max-w-md mx-auto leading-relaxed">
        The movie or page you are looking for has been cut from the final reel, relocated, or never existed in our catalog.
      </p>
    </div>

    <!-- Quick Search on 404 -->
    <div class="max-w-md mx-auto">
      <form (ngSubmit)="onSearch()" class="relative flex items-center">
        <input
          type="text"
          [(ngModel)]="searchQuery"
          name="searchQuery"
          placeholder="Search movies, classics, or directors..."
          class="w-full bg-gray-900/90 border border-gray-800 text-white text-sm rounded-xl pl-11 pr-24 py-3 placeholder-gray-500 focus:outline-none focus:border-red-500/80 focus:ring-2 focus:ring-red-500/20 backdrop-blur-md transition-all shadow-inner"
        />
        <svg
          class="w-5 h-5 text-gray-400 absolute left-3.5 pointer-events-none"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
          />
        </svg>
        <button
          type="submit"
          class="absolute right-1.5 px-4 py-2 text-xs font-semibold text-white bg-red-600 hover:bg-red-700 rounded-lg transition-colors shadow"
        >
          Search
        </button>
      </form>
    </div>

    <!-- Primary Action Buttons -->
    <div class="flex flex-wrap items-center justify-center gap-3 pt-2">
      <a
        routerLink="/"
        class="inline-flex items-center gap-2 px-6 py-3 rounded-xl bg-red-600 hover:bg-red-700 text-white font-semibold text-sm transition-all shadow-lg shadow-red-950/50 hover:scale-[1.02] active:scale-[0.98]"
      >
        <span>🏠</span>
        <span>Return to Home</span>
      </a>

      <a
        routerLink="/trending"
        class="inline-flex items-center gap-2 px-6 py-3 rounded-xl bg-gray-900 hover:bg-gray-800 border border-gray-800 text-gray-200 font-semibold text-sm transition-all hover:text-white hover:scale-[1.02] active:scale-[0.98]"
      >
        <span>🔥</span>
        <span>Trending Now</span>
      </a>
    </div>

    <!-- Quick Exploration Links -->
    <div class="pt-6 border-t border-gray-900">
      <p class="text-xs uppercase tracking-wider text-gray-500 font-semibold mb-3">
        Popular Destinations
      </p>
      <div class="flex flex-wrap items-center justify-center gap-2 text-xs text-gray-400">
        <a routerLink="/latest" class="px-3 py-1.5 rounded-lg bg-gray-900/60 border border-gray-800/80 hover:text-white hover:bg-gray-800 transition-colors">
          Latest Releases
        </a>
        <a routerLink="/top-rated" class="px-3 py-1.5 rounded-lg bg-gray-900/60 border border-gray-800/80 hover:text-white hover:bg-gray-800 transition-colors">
          Top Rated
        </a>
        <a routerLink="/popular" class="px-3 py-1.5 rounded-lg bg-gray-900/60 border border-gray-800/80 hover:text-white hover:bg-gray-800 transition-colors">
          Popular
        </a>
        <a routerLink="/favorites" class="px-3 py-1.5 rounded-lg bg-gray-900/60 border border-gray-800/80 hover:text-white hover:bg-gray-800 transition-colors">
          My Watchlist
        </a>
      </div>
    </div>
  </div>
</div>
